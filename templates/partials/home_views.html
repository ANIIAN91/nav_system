<!-- 搜索中枢：导航与文章视图共用 -->
<div class="home-search">
    <label class="search-box" aria-label="搜索导航与文章">
        <span class="ic">⌕</span>
        <input type="search" id="home-search-input" placeholder="搜索链接或笔记，回车打开…" autocomplete="off">
        <span class="search-hint">Ctrl/⌘K</span>
    </label>
    <button type="button" id="search-cross-hint" class="search-cross-hint" hidden></button>
</div>

<section id="home-navigation" class="content-slab nav-slab view-pane">
    <nav id="category-nav" class="category-nav">
        <div class="category-nav-container">
            <div class="skeleton-nav">
                <div class="skeleton-category"></div>
                <div class="skeleton-category"></div>
                <div class="skeleton-category"></div>
                <div class="skeleton-category"></div>
            </div>
        </div>
    </nav>

    <div id="links-container" class="links-container">
        <div class="skeleton-links">
            <div class="skeleton-link"></div>
            <div class="skeleton-link"></div>
            <div class="skeleton-link"></div>
            <div class="skeleton-link"></div>
            <div class="skeleton-link"></div>
            <div class="skeleton-link"></div>
        </div>
    </div>
</section>

<section id="home-articles" class="content-slab article-slab view-pane hidden">
    <div class="card-grid" id="article-grid">
        <div class="skeleton-article"></div>
        <div class="skeleton-article"></div>
        <div class="skeleton-article"></div>
        <div class="skeleton-article"></div>
    </div>
</section>
